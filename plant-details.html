<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Details - Sri Lavanya Nursery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <!-- enable backend features -->
    <script>
        window.hasBackend = true;
        window.API_BASE = window.API_BASE || (window.location.origin && window.location.origin !== 'null' ? window.location.origin : 'http://localhost:3000');
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-green-700 tracking-tight">Sri Lavanya Nursery</a>
            <div class="flex items-center gap-4">
                <a href="track-order.html" class="font-medium hover:text-green-600"><i class="fas fa-box mr-1"></i>Track Order</a>
                <button id="login-button" type="button" onclick="window.location.href='login.html'" class="font-medium hover:text-green-600 inline-flex items-center gap-1"><i class="fas fa-user mr-1"></i>Login</button>
                <button id="profile-button" type="button" onclick="window.location.href='track-order.html'" class="hidden font-medium hover:text-green-600 inline-flex items-center gap-1"><i class="fas fa-user mr-1"></i><span id="profile-label">Profile</span></button>
                <button type="button" onclick="toggleWishlistSidebar()" class="relative text-pink-600 hover:text-pink-700 text-2xl">
                    <i class="fas fa-heart"></i>
                    <span id="wishlist-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold hidden">0</span>
                </button>
                <button type="button" onclick="toggleCart()" class="cart-button relative text-green-600 hover:text-green-700 text-2xl">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Cart Sidebar (copied minimal structure so cart.js can operate) -->
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-80 bg-white shadow-lg z-40 transform translate-x-full transition-transform duration-300 overflow-y-auto">
        <div class="p-6 bg-green-600 text-white flex justify-between items-center sticky top-0">
            <h2 class="text-xl font-bold">Your Cart</h2>
            <button type="button" onclick="toggleCart()" class="text-2xl hover:text-gray-200"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items" class="p-6">
            <p class="text-gray-500 text-center py-8">Your cart is empty</p>
        </div>
        <div class="border-t p-6 sticky bottom-0 bg-white">
            <button type="button" onclick="orderFromCart()" id="order-btn-cart" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition flex items-center justify-center gap-2 disabled:opacity-50" disabled>
                <i class="fab fa-whatsapp"></i> Order Now
            </button>
        </div>
    </div>
    <div id="cart-overlay" class="fixed inset-0 bg-black opacity-50 z-30 hidden" onclick="toggleCart()"></div>
    <aside id="wishlist-sidebar" class="fixed right-0 top-0 h-full w-80 bg-white shadow-lg z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto">
        <div class="p-6 bg-pink-600 text-white flex justify-between items-center sticky top-0">
            <h2 class="text-xl font-bold">Your Wishlist</h2>
            <button type="button" onclick="toggleWishlistSidebar()" class="text-2xl hover:text-pink-200"><i class="fas fa-times"></i></button>
        </div>
        <div id="wishlist-items" class="p-6">
            <p class="text-gray-500 text-center py-8">Your wishlist is empty</p>
        </div>
    </aside>
    <div id="wishlist-overlay" class="fixed inset-0 bg-black opacity-50 z-30 hidden" onclick="toggleWishlistSidebar()"></div>

    <!-- Toast -->
    <div id="toast" class="fixed top-6 right-6 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Added to cart!</span>
    </div>

    <main class="container mx-auto px-6 py-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 flex items-start">
                <div class="w-full">
                    <div class="mb-4">
                        <button type="button" onclick="window.location.href='index.html'" class="text-green-700 font-semibold hover:text-green-800">← Back to Home</button>
                    </div>
                    <div class="bg-white rounded-lg shadow p-4">
                        <div class="h-64 bg-green-50 flex items-center justify-center overflow-hidden rounded cursor-pointer group relative" id="main-img-container" onclick="openLightbox()">
                            <img id="plant-image" src="" alt="Plant" class="w-full h-full object-contain object-center transition-transform duration-300 group-hover:scale-110">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300 flex items-center justify-center">
                                <i class="fas fa-expand text-white text-3xl opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            </div>
                        </div>
                        <div id="thumbs" class="mt-3 flex items-center gap-2 overflow-x-auto pb-2"></div>
                    </div>
                </div>
            </div>
            <div class="md:col-span-2">
                <h1 id="plant-name" class="text-3xl font-bold mb-2"></h1>
                <p id="plant-category" class="text-sm text-green-600 uppercase mb-4"></p>

                <div class="mb-4">
                    <h4 class="font-semibold mb-2">Choose Size</h4>
                    <div class="flex gap-3 mb-2">
                        <button type="button" id="size-small" class="size-btn px-4 py-2 bg-gray-100 rounded" onclick="selectSize('Small')">Small</button>
                        <button type="button" id="size-medium" class="size-btn px-4 py-2 bg-gray-100 rounded" onclick="selectSize('Medium')">Medium</button>
                        <button type="button" id="size-large" class="size-btn px-4 py-2 bg-gray-100 rounded" onclick="selectSize('Large')">Large</button>
                    </div>
                    <p class="text-sm text-gray-600">Selected: <span id="selected-size">None</span></p>
                    <div class="mt-3 flex items-center gap-3">
                        <label class="text-sm">Quantity</label>
                        <input id="quantity" type="number" min="0" max="1000" value="1000" class="w-20 px-3 py-2 border rounded" />
                    </div>
                    <div class="mt-4">
                        <label for="product-comment" class="block text-sm font-semibold text-gray-700 mb-2">Order note</label>
                        <textarea id="product-comment" rows="3" class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-green-500 focus:outline-none" placeholder="Describe your preferences or how you'll use this plant."></textarea>
                    </div>
                </div>

                <div class="flex gap-4 mt-6">
                        <button type="button" id="add-to-cart-btn" onclick="addThisToCart(this)" class="bg-green-600 text-white px-6 py-3 rounded font-bold hover:bg-green-700">Add to Cart</button>
                    <button type="button" id="wishlist-btn" onclick="toggleWishlist(document.getElementById('plant-name').textContent, selectedSize, this)" class="bg-pink-600 text-white px-6 py-3 rounded font-bold hover:bg-pink-700">Add to Wishlist</button>
                    <button type="button" id="order-now-btn" onclick="orderThisNow()" class="bg-amber-600 text-white px-6 py-3 rounded font-bold hover:bg-amber-700">Order Now</button>
                </div>

                <div class="mt-8">
                    <h4 class="font-semibold mb-2">Care Instructions</h4>
                    <div id="care-content" class="text-sm text-gray-700 bg-gray-50 p-3 rounded">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/plants.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/plant-details.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', updateProfileButton);

        function updateProfileButton() {
            const customer = getCurrentCustomer();
            const loginButton = document.getElementById('login-button');
            const profileButton = document.getElementById('profile-button');
            const profileLabel = document.getElementById('profile-label');

            if (customer) {
                if (loginButton) loginButton.classList.add('hidden');
                if (profileButton) {
                    profileButton.classList.remove('hidden');
                    if (profileLabel) profileLabel.textContent = customer.name || 'Profile';
                }
            } else {
                if (loginButton) loginButton.classList.remove('hidden');
                if (profileButton) profileButton.classList.add('hidden');
            }
        }
    </script>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden flex items-center justify-center" onclick="closeLightbox(event)">
        <div class="relative max-w-4xl w-full mx-auto" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white text-3xl hover:text-gray-300"><i class="fas fa-times"></i></button>
            <img id="lightbox-image" src="" alt="Plant fullscreen" class="w-full h-auto max-h-screen object-contain object-center rounded">
            <button id="lb-prev" onclick="lightboxPrev()" class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-4xl hover:text-gray-300"><i class="fas fa-chevron-left"></i></button>
            <button id="lb-next" onclick="lightboxNext()" class="absolute right-4 top-1/2 -translate-y-1/2 text-white text-4xl hover:text-gray-300"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</body>
</html>
